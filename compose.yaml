name: sikio
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sikio}
      POSTGRES_USER: sikio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts:/ops:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: sikio:${SIKIO_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://sikio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/${POSTGRES_DB:-sikio}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:?Set PHX_HOST in .env}
      PORT: '4000'
      PHX_BIND_IP: '0.0.0.0'
      POOL_SIZE: '10'
    ports:
      - '127.0.0.1:${SIKIO_PORT:-4011}:4000'
volumes:
  postgres_data:
