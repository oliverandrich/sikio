name: CI
# The three parts of `mise run check` as jobs side by side, and the release smoke test.
# The release workflow calls it too, so nothing is published that these reject.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      # The release builds and smoke-tests its own, on the systems it ships for.
      skip_smoke:
        type: boolean
        default: false
permissions:
  contents: read
# A task installs only what the job asked mise-action for.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Workflows, secrets, licences and the player's browser modules: no build and no database.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads every commit, not only the one under test.
          fetch-depth: 0
      # Only what the part needs, not Erlang and Elixir.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: zizmor gitleaks node
      - run: mise run check:lint

  # The default build gets every check, the browser features included.
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: erlang elixir node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix1-test-sqlite-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-mix1-test-sqlite-
      - run: mix deps.get --check-locked
      # The lockfile pins playwright, and each playwright version pins its browser build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('assets/package-lock.json') }}
      - run: mise run browser:npm
      # The runner image does not promise the system libraries the headless Chrome needs.
      # check:sqlite then installs the browser itself through its `browser` dependency.
      - run: npm exec --prefix assets -- playwright install-deps chromium
      - run: mise run check:sqlite

  # What depends on the database, again for PostgreSQL. The browser features stay with SQLite.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: erlang elixir
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix1-test-postgres-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-mix1-test-postgres-
      - run: mix deps.get --check-locked
      - run: mise run check:postgres

  # The release reads config/runtime.exs at boot, which no test above runs end to end.
  smoke:
    # On push and pull_request there are no inputs, and an empty one is not true.
    if: ${{ !inputs.skip_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: erlang elixir
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix1-prod-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-mix1-prod-
      - run: mise run smoke
