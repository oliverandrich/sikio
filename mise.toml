[tools]
elixir = "1.20.4-otp-29"
erlang = "29.1.1"
zizmor = "1.30.1"
node = "26"
# Runs scripts/icons.py with the dependencies it names.
uv = "0.12.22"

[tasks.setup]
description = "Install dependencies, create the development database and build assets"
env.MIX_ENV = "dev"
run = "mix setup"

[tasks.dev]
description = "Start the development server in the foreground"
env.MIX_ENV = "dev"
run = "mix phx.server"

[tasks.debugserver]
description = "Start the development server with IEx"
env.MIX_ENV = "dev"
raw = true
run = "iex -S mix phx.server"

[tasks.check]
env.MIX_ENV = "test"
description = "Check workflows, compile, format, lint, security, assets and tests"
# The player's browser half is plain modules with no framework, so node's own runner covers it.
# No npm package is needed for it, and none is installed.
# SQLite is the default build and gets every check; Postgres repeats what depends on the database.
run = [
  "zizmor .github/",
  "mise run license",
  "SIKIO_DATABASE=sqlite mix precommit",
  "SIKIO_DATABASE=postgres mix check.database",
  "node --test assets/js/*.test.mjs",
]

[tasks.test]
description = "Run the tests against SQLite and Postgres, and the browser modules"
env.MIX_ENV = "test"
run = [
  "SIKIO_DATABASE=sqlite mix test",
  "SIKIO_DATABASE=postgres mix test",
  "node --test assets/js/*.test.mjs",
]

[tasks.format]
run = "mix format"

[tasks.credo]
run = ["mix compile --warnings-as-errors", "mix credo --strict"]

[tasks.audit]
description = "Audit dependency advisories and retired packages separately"
run = ["mix deps.audit", "mix hex.audit"]

[tasks.setup-code]
description = "Issue the code that lets somebody claim this instance, printed once"
env.MIX_ENV = "dev"
# --no-start so this may run beside the server: it wakes the repository and nothing else.
run = "mix run --no-start -e 'Sikio.Release.setup_code!()'"

[tasks.migrate]
description = "Apply pending development database migrations"
env.MIX_ENV = "dev"
run = "mix ecto.migrate"

[tasks.icons]
description = "Draw the app icons, favicon and README logo from the wordmark"
run = "uv run scripts/icons.py"

[tasks.beans]
run = "beans list --no-status completed --no-status scrapped"

[tasks.release]
description = "Build a production release for the current OS and architecture"
env.MIX_ENV = "prod"
run = ["mix deps.get --only prod", "mix assets.setup", "mix compile --warnings-as-errors", "mix assets.deploy", "mix release --overwrite"]

[tasks.smoke]
description = "Build a release for each database and run it against a disposable one"
# `mise run release` reads SIKIO_DATABASE from the command, so each pair builds what it checks.
run = [
  "SIKIO_DATABASE=sqlite mise run release",
  "SIKIO_DATABASE=sqlite elixir scripts/smoke_release.exs",
  "SIKIO_DATABASE=postgres mise run release",
  "SIKIO_DATABASE=postgres elixir scripts/smoke_release.exs",
]

[tasks.reset]
description = "Drop and recreate the development database, migrate and seed it"
env.MIX_ENV = "dev"
run = "mix ecto.reset"
